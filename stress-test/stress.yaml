apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress
  template:
    metadata:
      labels:
        app: stress
    spec:
      containers:
      - name: stress
        image: polinux/stress
        args:
        - stress
        - --cpu
        - "1"
        - --vm
        - "1"
        - --vm-bytes
        - "256M"
        - --timeout
        - "300s"
        resources:
          limits:
            cpu: "2"
            memory: 512Mi
