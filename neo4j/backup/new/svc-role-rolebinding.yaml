---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j-backup-sa
  namespace: neo4j
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neo4j-backup-role
  namespace: neo4j
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets/scale", "statefulsets"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neo4j-backup-rolebinding
  namespace: neo4j
subjects:
- kind: ServiceAccount
  name: neo4j-backup-sa
  namespace: neo4j
roleRef:
  kind: Role
  name: neo4j-backup-role
  apiGroup: rbac.authorization.k8s.io
